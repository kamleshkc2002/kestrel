[package]
name = "kestrel"
version = "0.6.0-preview.1"
edition = "2021"
license = "MIT"
description = "Kestrel Linux utility suite"
[features]
default = ["gui"]
gui = ["dep:adw", "dep:gtk"]

[[bin]]
name = "kestrel"
path = "src/main.rs"
required-features = ["gui"]

[build-dependencies]
pkg-config = "0.3"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5", "gtk_v4_10"], optional = true }
async-channel = "2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"], optional = true }
kestrel-core = { path = "../../crates/kestrel-core" }
kestrel-platform = { path = "../../crates/kestrel-platform" }
kestrel-services = { path = "../../crates/kestrel-services" }
libc = "0.2"
log = "0.4"
# Unreleased master: `Tray::provide_xdg_activation_token` lets Wayland hosts
# such as COSMIC raise the window from a tray click.
ksni = { git = "https://github.com/iovxw/ksni", rev = "547cc42", features = ["blocking"] }
pangocairo = "0.22"
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3"
