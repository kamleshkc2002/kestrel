name: AppImage

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build AppImage (x86_64)
    env:
      KESTREL_LAYER_SHELL: required
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
      # Bumping a source in scripts/build-gtk-stack.sh changes this list and
      # the script hash below, so the stack cache misses and rebuilds.
      GTK_STACK_VERSIONS: wayland-1.22.0-wayland-protocols-1.34-glib-2.80.0-gtk-4.14.5-libadwaita-1.5.0-gtk4-layer-shell-1.3.0
    runs-on: ubuntu-24.04
    # glibc 2.35: Ubuntu 22.04, Linux Mint 21 and Debian 12 start the artifact.
    container:
      image: ubuntu:22.04
      # Docker's default 64 MB /dev/shm is too small for headless Sway.
      options: --shm-size=1g
    # Container jobs default to sh; the inspection steps use bash arrays and
    # process substitution.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install checkout prerequisites
        # The container image has neither git nor curl; checkout needs git.
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl git

      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build and packaging dependencies
        run: bash scripts/build-gtk-stack.sh --install-dependencies

      - name: Restore the GTK stack
        id: gtk-stack
        uses: actions/cache@v6
        with:
          path: /usr/local
          key: gtk-stack-${{ env.GTK_STACK_VERSIONS }}-${{ hashFiles('scripts/build-gtk-stack.sh') }}

      - name: Build the GTK stack
        if: steps.gtk-stack.outputs.cache-hit != 'true'
        run: bash scripts/build-gtk-stack.sh

      - name: Refresh the linker cache
        run: |
          ldconfig
          pkg-config --modversion gtk4 libadwaita-1

      - name: Install Rust 1.98
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain 1.98.0 \
              --component rustfmt --component clippy
          printf '%s\n' "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Validate desktop metadata
        run: desktop-file-validate data/io.github.kamleshkc2002.Kestrel.desktop

      - name: Build AppImage
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0-preview' }}
          # linuxdeploy resolves the source libraries through ldd.
          LD_LIBRARY_PATH: /usr/local/lib
        run: |
          version="${VERSION#v}"
          bash scripts/build-appimage.sh "$version"

      - name: Inspect bundled artifact
        run: |
          appimage="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test -x "$appimage"
          file "$appimage" | grep -q 'ELF 64-bit'
          "$appimage" --appimage-extract >/dev/null
          grep -q 'libgtk4-layer-shell.so.0' <(ldd squashfs-root/usr/bin/kestrel)
          test -n "$(find squashfs-root/usr/lib -name 'libgtk4-layer-shell.so.0*' -print -quit)"
          test -x squashfs-root/usr/bin/kestrel
          test -x squashfs-root/usr/bin/kestrel-record
          test -f squashfs-root/io.github.kamleshkc2002.Kestrel.desktop
          test -f squashfs-root/io.github.kamleshkc2002.Kestrel.svg
          grep -q 'libadwaita' <(ldd squashfs-root/usr/bin/kestrel)
          # GStreamer comes from the host; only the helper links it.
          if ldd squashfs-root/usr/bin/kestrel | grep -qi 'libgst'; then
            echo 'kestrel still links GStreamer' >&2
            exit 1
          fi
          patchelf --print-needed squashfs-root/usr/bin/kestrel-record | grep -q '^libgstreamer'
          if find squashfs-root/usr/lib -name 'libgst*' -print -quit | grep -q .; then
            echo 'the AppImage bundled GStreamer' >&2
            exit 1
          fi
          (
            cd dist
            sha256sum --check "$(basename "$appimage").sha256"
          )

      - name: Inspect bundled glibc requirements
        # The build host is the oldest supported base: every ELF must run on
        # glibc 2.35. A higher tag means a library was built somewhere newer.
        run: |
          max_allowed=2.35
          offenders=()
          while IFS= read -r -d '' file; do
            if [ "$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')" != "7f454c46" ]; then
              continue
            fi
            versions="$(objdump -T "$file" 2>/dev/null | grep -o 'GLIBC_[0-9][0-9.]*' || true)"
            [ -n "$versions" ] || continue
            version="$(printf '%s\n' "$versions" | sed 's/^GLIBC_//' | sort -V | tail -n 1)"
            if dpkg --compare-versions "$version" gt "$max_allowed"; then
              offenders+=("${file#squashfs-root/} needs GLIBC_$version")
            fi
          done < <(find squashfs-root -type f -print0)
          if [ "${#offenders[@]}" -ne 0 ]; then
            printf '%s ELF file(s) need glibc newer than %s:\n' \
              "${#offenders[@]}" "$max_allowed" >&2
            printf '  %s\n' "${offenders[@]}" >&2
            exit 1
          fi
          echo "Every bundled object runs with glibc $max_allowed or older."

      - name: Smoke-test layer-shell placement
        # The bundled gtk4-layer-shell must turn the command bar into an overlay.
        # Sway refuses to run as root, and container jobs run as root, so give
        # the smoke its own unprivileged user and let it read the AppDir.
        run: |
          useradd --create-home --uid 1001 smoke
          chmod -R a+rX squashfs-root
          runuser -u smoke -- env HOME=/home/smoke \
            bash scripts/layer-shell-smoke.sh "$PWD/squashfs-root/AppRun"

      - name: Smoke-test application startup
        run: |
          appimage="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          set +e
          GTK_IM_MODULE=ibus timeout 10s xvfb-run -a \
            "$appimage" --appimage-extract-and-run 2>appimage-smoke.log
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 124
          ! grep -q 'No IM module matching' appimage-smoke.log

      - name: Smoke-test startup without GStreamer
        # Hide the host GStreamer runtime; the window must still open, and
        # recording must report what to install.
        run: bash scripts/no-gstreamer-smoke.sh squashfs-root

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kestrel-x86_64-AppImage
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign and publish
    needs: build
    # minisign is not packaged in jammy; signing runs on the host instead.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download AppImage
        uses: actions/download-artifact@v7
        with:
          name: Kestrel-x86_64-AppImage
          path: dist

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y minisign

      - name: Sign AppImage
        # Releases must carry a signature; builds without the secret (forks) skip it.
        id: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          appimage="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "MINISIGN_SECRET_KEY is required to publish a release" >&2
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing key in this build; the AppImage stays unsigned."
            exit 0
          fi
          key="$RUNNER_TEMP/release-signing.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          minisign -S -s "$key" -m "$appimage" -t "$(basename "$appimage")"
          rm -f "$key"
          minisign -V -p data/release-signing.pub -m "$appimage"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed artifact
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Kestrel-x86_64-AppImage
          path: |
            dist/*.AppImage
            dist/*.sha256
            dist/*.minisig
          overwrite: true
          retention-days: 30

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.AppImage dist/*.sha256 dist/*.minisig \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kestrel ${GITHUB_REF_NAME#v} preview" \
            --generate-notes \
            --prerelease \
            --verify-tag
