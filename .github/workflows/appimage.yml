name: AppImage

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build AppImage (x86_64)
    env:
      KESTREL_LAYER_SHELL: required
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            desktop-file-utils file libadwaita-1-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-bin libgtk-4-dev libpulse-dev librsvg2-dev patchelf xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            meson ninja-build libwayland-dev wayland-protocols sway
      - name: Build gtk4-layer-shell
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell-build /tmp/gtk4-layer-shell \
            --prefix=/usr/local -Dintrospection=false -Dvapi=false -Ddocs=false \
            -Dexamples=false -Dtests=false -Dsmoke-tests=false
          meson compile -C /tmp/gtk4-layer-shell-build
          sudo meson install -C /tmp/gtk4-layer-shell-build
          sudo ldconfig

      - name: Validate desktop metadata
        run: desktop-file-validate data/io.github.kamleshkc2002.Kestrel.desktop

      - name: Build AppImage
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0-preview' }}
        run: |
          version="${VERSION#v}"
          bash scripts/build-appimage.sh "$version"

      - name: Inspect bundled artifact
        run: |
          appimage="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test -x "$appimage"
          file "$appimage" | grep -q 'ELF 64-bit'
          "$appimage" --appimage-extract >/dev/null
          grep -q 'libgtk4-layer-shell.so.0' <(ldd squashfs-root/usr/bin/kestrel)
          test -n "$(find squashfs-root/usr/lib -name 'libgtk4-layer-shell.so.0*' -print -quit)"
          test -x squashfs-root/usr/bin/kestrel
          test -f squashfs-root/io.github.kamleshkc2002.Kestrel.desktop
          test -f squashfs-root/io.github.kamleshkc2002.Kestrel.svg
          grep -q 'libadwaita' <(ldd squashfs-root/usr/bin/kestrel)
          # GStreamer comes from the host.
          ! find squashfs-root/usr/lib -name 'libgst*' -print -quit | grep -q .
          (
            cd dist
            sha256sum --check "$(basename "$appimage").sha256"
          )

      - name: Smoke-test layer-shell placement
        # The bundled gtk4-layer-shell must turn the command bar into an overlay.
        run: bash scripts/layer-shell-smoke.sh squashfs-root/AppRun

      - name: Smoke-test application startup
        run: |
          appimage="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          set +e
          GTK_IM_MODULE=ibus timeout 10s xvfb-run -a \
            "$appimage" --appimage-extract-and-run 2>appimage-smoke.log
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 124
          ! grep -q 'No IM module matching' appimage-smoke.log

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kestrel-x86_64-AppImage
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.AppImage dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kestrel ${GITHUB_REF_NAME#v} preview" \
            --generate-notes \
            --prerelease \
            --verify-tag
