name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-test:
    name: Quality and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

  phase-0-spikes:
    name: Phase 0 spikes
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Compile system-monitor probe
        run: rustc --edition 2021 -D warnings spikes/system-monitor/probe.rs -o /tmp/kestrel-system-monitor-probe

      - name: Validate audio spike
        run: |
          cargo fmt --manifest-path spikes/audio/Cargo.toml --check
          cargo clippy --manifest-path spikes/audio/Cargo.toml -- -D warnings
          cargo test --manifest-path spikes/audio/Cargo.toml

      - name: Validate clipboard spike
        run: |
          cargo fmt --manifest-path spikes/clipboard/Cargo.toml --check
          cargo clippy --manifest-path spikes/clipboard/Cargo.toml -- -D warnings
          cargo test --manifest-path spikes/clipboard/Cargo.toml
