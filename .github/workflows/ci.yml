name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-test:
    name: Quality and test
    runs-on: ubuntu-latest
    env:
      KESTREL_LAYER_SHELL: required
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Install native development packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libadwaita-1-dev libgtk-4-dev libpulse-dev xvfb dbus \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            meson ninja-build libwayland-dev wayland-protocols
      - name: Build gtk4-layer-shell
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell-build /tmp/gtk4-layer-shell \
            --prefix=/usr/local -Dintrospection=false -Dvapi=false -Ddocs=false \
            -Dexamples=false -Dtests=false -Dsmoke-tests=false
          meson compile -C /tmp/gtk4-layer-shell-build
          sudo meson install -C /tmp/gtk4-layer-shell-build
          sudo ldconfig

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint without gtk4-layer-shell
        # Builds without the library place floating surfaces as normal windows.
        env:
          KESTREL_LAYER_SHELL: "off"
        run: cargo clippy --package kestrel --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

  clipboard-clean-session:
    name: Clipboard clean session
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Install clean-session packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse-dev sway xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Validate clipboard lifecycle in clean sessions
        run: KESTREL_REQUIRE_CLEAN_SESSION=1 bash scripts/clipboard-clean-session.sh
