name: AUR

on:
  pull_request:
    paths:
      - "packaging/aur/**"
      - ".github/workflows/aur.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A superseded pull request run stops; tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Build package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm base-devel git

      - name: Create build user
        # makepkg refuses to run as root; -s installs dependencies as this user.
        run: |
          useradd --create-home builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >/etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

      - name: Check out source
        uses: actions/checkout@v7

      - name: Build package
        working-directory: packaging/aur
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder env KESTREL_LOCAL_SOURCE="$GITHUB_WORKSPACE" \
            makepkg -s --noconfirm

      - name: Inspect package contents
        working-directory: packaging/aur
        run: |
          # The package is named kestrel-desktop while the binaries keep their
          # names. makepkg also writes a -debug package; inspect the package
          # itself.
          package="$(find . -maxdepth 1 -name 'kestrel-desktop-[0-9]*.pkg.tar.*' -print -quit)"
          test -n "$package"
          bsdtar -tf "$package" >/tmp/contents
          grep -qx 'usr/bin/kestrel' /tmp/contents
          grep -qx 'usr/bin/kestrel-record' /tmp/contents
          grep -qx 'usr/share/applications/io.github.kamleshkc2002.Kestrel.desktop' /tmp/contents
          grep -qx 'usr/share/icons/hicolor/scalable/apps/io.github.kamleshkc2002.Kestrel.svg' /tmp/contents
          grep -qx 'usr/share/metainfo/io.github.kamleshkc2002.Kestrel.metainfo.xml' /tmp/contents

      - name: Check package metadata
        working-directory: packaging/aur
        run: |
          # Users build from the committed metadata; keep it generated by makepkg.
          # makepkg refuses to run as root, so use the build user.
          sudo -H -u builder makepkg --printsrcinfo >/tmp/srcinfo
          diff -u .SRCINFO /tmp/srcinfo
          pacman -S --needed --noconfirm namcap || {
            printf 'namcap is unavailable; skipping.\n'
            exit 0
          }
          namcap PKGBUILD
          package="$(find . -maxdepth 1 -name 'kestrel-desktop-[0-9]*.pkg.tar.*' -print -quit)"
          namcap "$package"
