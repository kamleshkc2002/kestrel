# Weekly version updates; security updates arrive as advisories are published.
#
# The Rust toolchain in rust-toolchain.toml is not covered.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # gtk-rs crates release together.
      gtk-rs:
        patterns:
          - "gtk4*"
          - "gdk4*"
          - "gsk4*"
          - "libadwaita*"
          - "glib*"
          - "gio*"
          - "cairo-rs*"
          - "pango*"
          - "gdk-pixbuf*"
          - "graphene-rs*"
      zbus:
        patterns:
          - "zbus*"
          - "zvariant*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
