name: Linux GTK build dependencies
description: >-
  Installs the pinned Rust toolchain, the GTK and GStreamer development
  packages, and gtk4-layer-shell built from source, so every job that compiles
  Kestrel starts from the same toolchain and library prefix.

inputs:
  packages:
    description: Additional apt packages the job needs.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install pinned Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98.0
        components: rustfmt, clippy

    - name: Install native development packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          libadwaita-1-dev libgtk-4-dev libpulse-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
          meson ninja-build libwayland-dev wayland-protocols \
          ${{ inputs.packages }}

    - name: Build gtk4-layer-shell
      # Installed to /usr/local; the workflows set KESTREL_LAYER_SHELL=required
      # where a binary must link it and target/debug binaries find it at run
      # time.
      shell: bash
      run: |
        git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
        meson setup /tmp/gtk4-layer-shell-build /tmp/gtk4-layer-shell \
          --prefix=/usr/local -Dintrospection=false -Dvapi=false -Ddocs=false \
          -Dexamples=false -Dtests=false -Dsmoke-tests=false
        meson compile -C /tmp/gtk4-layer-shell-build
        sudo meson install -C /tmp/gtk4-layer-shell-build
        sudo ldconfig
