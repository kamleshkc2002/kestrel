# What changed in this release, shown once after an update and kept under
# Settings. Rewrite this file for each release.
#
# One [[change]] per user-visible change: `feature` is a registered feature ID
# (or "kestrel" for app-wide changes) and `text` is one plain sentence.

[[change]]
feature = "clipboard.history"
text = "Clean links removes tracking parameters such as utm_source from a link, shows what it removes, and can clean a single copied link automatically when you turn it on."

[[change]]
feature = "files.shelf"
text = "The new Shelf holds files, text, and links you drag in until you drag them out to another app, with a floating surface you can pin open while you work in other windows; it is cleared on quit unless you choose to keep it."

[[change]]
feature = "files.shelf"
text = "A shelf entry for a package or disk image can be handed to the app your desktop uses for that type, after a confirmation that names the app and leaves the file unchanged."
