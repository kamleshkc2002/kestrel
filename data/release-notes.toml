# What changed in this release, shown once after an update and kept under
# Settings. Rewrite this file for each release.
#
# One [[change]] per user-visible change: `feature` is a registered feature ID
# (or "kestrel" for app-wide changes) and `text` is one plain sentence.

[[change]]
feature = "kestrel"
text = "Kestrel 1.0 keeps your settings, data files, feature IDs, and kestrel --command IDs working across every 1.x update; anything that must change gets a migration first."

[[change]]
feature = "kestrel"
text = "The window list waits for the compositor instead of checking a hundred times a second, so an idle Kestrel wakes far less often."

[[change]]
feature = "kestrel"
text = "Screen-sharing and screenshot dialogs name Kestrel, however it was started."
