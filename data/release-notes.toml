# What changed in this release, shown once after an update and kept under
# Settings. Rewrite this file for each release.
#
# One [[change]] per user-visible change: `feature` is a registered feature ID
# (or "kestrel" for app-wide changes) and `text` is one plain sentence.

[[change]]
feature = "kestrel"
text = "Kestrel 1.0 keeps your settings, data files, feature IDs, and kestrel --command IDs working across every 1.x update; anything that must change gets a migration first."

[[change]]
feature = "kestrel"
text = "The window list waits for the compositor instead of checking a hundred times a second, so an idle Kestrel wakes far less often."

[[change]]
feature = "kestrel"
text = "Screen-sharing and screenshot dialogs no longer name the terminal or file manager that started Kestrel, and show Kestrel when its desktop entry is installed."

[[change]]
feature = "kestrel"
text = "A downloaded AppImage shows Kestrel's logo in the tray, and can add itself to the applications menu so the dock and screen-sharing dialogs show its icon and name."

[[change]]
feature = "kestrel"
text = "Open folder, Play, and the other buttons that open a file or folder work again on desktops whose portal refuses file links."

[[change]]
feature = "capture.recording"
text = "A finished recording says which folder it was saved in."
