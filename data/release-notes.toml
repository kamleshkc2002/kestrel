# What changed in this release, shown once after an update and kept under
# Settings. Rewrite this file for each release.
#
# One [[change]] per user-visible change: `feature` is a registered feature ID
# (or "kestrel" for app-wide changes) and `text` is one plain sentence.

[[change]]
feature = "clipboard.history"
text = "Clean links removes tracking parameters such as utm_source from a link, shows what it removes, and can clean a single copied link automatically when you turn it on."

[[change]]
feature = "files.shelf"
text = "The new Shelf holds files, text, and links you drag in until you drag them out to another app, with a floating surface you can pin open while you work in other windows; it is cleared on quit unless you choose to keep it."

[[change]]
feature = "files.shelf"
text = "A shelf entry for a package or disk image can be handed to the app your desktop uses for that type, after a confirmation that names the app and leaves the file unchanged."

[[change]]
feature = "files.shelf"
text = "Shelf file rows can move, rename, and show their file in your file manager, and copied images can be saved as PNG files."

[[change]]
feature = "capture.text"
text = "Each recent capture and the screenshot editor offer Copy text, which reads the words on this computer with the screen tools' OCR language and time limit and puts them on the clipboard without keeping them."

[[change]]
feature = "clipboard.history"
text = "Shift+Return or the Paste action puts a history entry on the clipboard, hides the window, and pastes it into the application you were using; the keystroke is Ctrl+V by default and can be set to Ctrl+Shift+V or Shift+Insert."

[[change]]
feature = "clipboard.history"
text = "A pending paste stops without a keystroke when the clipboard changes first, so a newer copy is never replaced."

[[change]]
feature = "clipboard.history"
text = "Clipboard writes that an application marks as temporary or secret are left out of history, and the selection they replace returns as the entry it already was."

[[change]]
feature = "kestrel"
text = "Settings → Remove Kestrel's data… lists every file and folder Kestrel keeps, with sizes, and removes only what you choose before quitting; `kestrel --uninstall-preview` prints the same list without deleting anything."
