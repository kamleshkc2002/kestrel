# What changed in this release, shown once after an update and kept under
# Settings. Rewrite this file for each release.
#
# One [[change]] per user-visible change: `feature` is a registered feature ID
# (or "kestrel" for app-wide changes) and `text` is one plain sentence.

[[change]]
feature = "kestrel"
text = "Kestrel 1.0 keeps your settings, data files, feature IDs, and kestrel --command IDs working across every 1.x update; anything that must change gets a migration first."

[[change]]
feature = "kestrel"
text = "The window list waits for the compositor instead of checking a hundred times a second, so an idle Kestrel wakes far less often."

[[change]]
feature = "kestrel"
text = "Screen-sharing and screenshot dialogs no longer name the terminal or file manager that started Kestrel, and show Kestrel when its desktop entry is installed."

[[change]]
feature = "kestrel"
text = "A downloaded AppImage shows Kestrel's logo in the tray, and can add itself to the applications menu so the dock and screen-sharing dialogs show its icon and name."

[[change]]
feature = "kestrel"
text = "Open folder, Play, and the other buttons that open a file or folder work again on desktops whose portal refuses file links."

[[change]]
feature = "capture.recording"
text = "A finished recording says which folder it was saved in."

[[change]]
feature = "clipboard.history"
text = "Paste can type the entry's text instead of sending a paste shortcut, for desktops where the shortcut arrives as a plain letter."

[[change]]
feature = "capture.recording"
text = "A running recording now shows its timer and a Stop button on screen, on the Overview Record tile, and in the tray menu."

[[change]]
feature = "snippets.text"
text = "Typing a snippet's trigger, such as ;addr, in the command bar finds and inserts it, and the snippet editor explains each field."

[[change]]
feature = "snippets.text"
text = "With both wtype and xdotool installed, Kestrel picks the one that works in your session."

[[change]]
feature = "commands.bar"
text = "Typing a feature's name in the command bar offers to open its page, the on and off results really switch the feature, and the bar no longer flashes a result count while you type."

[[change]]
feature = "clipboard.history"
text = "Copying or pasting an entry replaces the clipboard directly, so it no longer empties it for a moment, which on some desktops lost the copy or made a paste report that the clipboard changed."

[[change]]
feature = "clipboard.history"
text = "The paste shortcut now reaches apps on desktops that dropped its Ctrl or Shift key, so pasting into the previous app works for text, images, and files there."
