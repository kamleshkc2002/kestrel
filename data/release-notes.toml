# What changed in this release, shown once after an update and kept under
# Settings. Rewrite this file for each release.
#
# One [[change]] per user-visible change: `feature` is a registered feature ID
# (or "kestrel" for app-wide changes) and `text` is one plain sentence.

[[change]]
feature = "clipboard.history"
text = "In the Flatpak, Keep pinned entries across restarts is unavailable because the sandbox cannot reach the desktop keyring, and the switch says so instead of asking for one."

[[change]]
feature = "capture.screenshot"
text = "Recent capture rows put their actions on a second line, so each title and detail stays readable in a narrow window."

[[change]]
feature = "capture.recording"
text = "Refresh now re-lists recordings and captures added to their folders outside Kestrel."
