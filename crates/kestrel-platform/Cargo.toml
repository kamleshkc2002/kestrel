[package]
name = "kestrel-platform"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Platform adapter boundaries for Kestrel"

[dependencies]
gio = "0.20"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
kestrel-core = { path = "../kestrel-core" }
libpulse-binding = "2.30.1"
wl-clipboard-rs = "0.9.3"
x11rb = "0.13"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"
