[package]
name = "kestrel-platform"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Platform adapter boundaries for Kestrel"

[dependencies]
gio = "0.22"
gio-unix = "0.22"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
kestrel-core = { path = "../kestrel-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
libpulse-binding = "2.30.1"
libc = "0.2"
minisign-verify = "0.3"
png = "0.18"
wayland-client = { version = "0.31", default-features = false }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"] }
wl-clipboard-rs = "0.9.3"
x11rb = { version = "0.14", features = ["xfixes"] }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
async-io = "2"
futures-lite = "2"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.4"
zeroize = "1.8"
linuxvideo = "0.3"
zune-jpeg = "0.5"
zune-core = "0.5"

[dev-dependencies]
tempfile = "3"
x11rb = { version = "0.14", features = ["xtest"] }
