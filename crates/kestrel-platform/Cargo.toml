[package]
name = "kestrel-platform"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Platform adapter boundaries for Kestrel"

[dependencies]
gio = "0.22"
gio-unix = "0.22"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
kestrel-core = { path = "../kestrel-core" }
libpulse-binding = "2.30.1"
libc = "0.2"
png = "0.18"
wayland-client = { version = "0.31", default-features = false }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"] }
wl-clipboard-rs = "0.9.3"
x11rb = "0.14"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
linuxvideo = "0.3"
zune-jpeg = "0.5"
zune-core = "0.5"
gstreamer = "0.25"
gstreamer-app = "0.25"

[dev-dependencies]
tempfile = "3"
x11rb = { version = "0.14", features = ["xtest"] }
