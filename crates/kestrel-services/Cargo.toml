[package]
name = "kestrel-services"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Feature service lifecycle and registry boundaries for Kestrel"

[dependencies]
kestrel-core = { path = "../kestrel-core" }
kestrel-platform = { path = "../kestrel-platform" }
zeroize = "1.8"
png = "0.18"
rqrr = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
tempfile = "3"
